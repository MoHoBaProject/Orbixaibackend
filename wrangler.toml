name = "orbixai-backend"
compatibility_date = "2025-05-05"
compatibility_flags = ["nodejs_compat"]
main = ".open-next/worker.js"

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[vars]
# Which websites may call this backend from the browser (CORS). Comma-separated list; "*" = any site.
ALLOWED_ORIGIN = "https://orbixai.ir,https://www.orbixai.ir,http://localhost:3000"

# ---- Database (Cloudflare D1) — NOT needed yet. When you need one: ----
# 1) npx wrangler d1 create orbixai-db        → it prints a database_id
# 2) remove the "#" from the 4 lines below and paste that id
# 3) commit + push → /api/health will automatically show  db: "connected"
#
# [[d1_databases]]
# binding = "DB"
# database_name = "orbixai-db"
# database_id = "PASTE_DATABASE_ID_HERE"
